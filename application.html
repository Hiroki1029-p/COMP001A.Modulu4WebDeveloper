<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ichiraku - Application Page</title>
    <link rel="stylesheet" href="main.css">
    <link rel="shortcut icon" href="images/icon.jpg">
</head>
<body>
    <header>
        <h1>Welcome to Ichiraku</h1>
        <nav>
            <ul class="navbar">
                <li><a href="index.html">Home</a></li>
                <li><a href="ramen.html">Menu</a></li>
                <li><a href="media.html">Media</a></li>
                <li><a href="contact.html">Contact</a></li>
                <li><a href="form.html">Application Form</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <div class="application-form">
            <h2>Application Form</h2>
            <p>Please fill out the form below to apply for a position at Ichiraku Ramen.</p>
            <form action="submit_application.php" method="post">
                <label for="name">Full Name:</label><br>
                <input type="text" id="name" name="name" required><br><br>

                <label for="email">Email Address:</label><br>
                <input type="email" id="email" name="email" required><br><br>

                <label for="phone">Phone Number:</label><br>
                <input type="tel" id="phone" name="phone" required><br><br>

                <label for="age">Age:</label><br>
                <input type="number" id="age" name="age" min="16" max="120"><br><br>

                <label for="position">Position Applying For:</label><br>
                <select id="position" name="position" required>
                    <option value="">Select a position</option>
                    <option value="server">Server</option>
                    <option value="kitchen_staff">Kitchen Staff</option>
                    <option value="cashier">Cashier</option>
                </select><br><br>

                <label for="availability">Availability:</label><br>
                <textarea id="availability" name="availability" rows="4" cols="50" required></textarea><br><br>

                <label for="experience">Previous Experience (if any):</label><br>
                <textarea id="experience" name="experience" rows="4" cols="50"></textarea><br><br>

                <label for="additional comments">Additional Comments:</label><br>
                <textarea id="comments" name="comments" rows="4" cols="50"></textarea><br><br>

                <input type="checkbox" id="terms" name="terms" required>
                <label for="terms">I agree to the terms and conditions.</label><br><br>
                
                <input type="submit" value="Submit Application">
                <input type="reset" value="Reset Form">
            </form>
        </div>
    </main>
    <footer>
        <p>&copy; 2024 Ichiraku Ramen. All rights reserved.</p>
    </footer> 
</body>
</html>
