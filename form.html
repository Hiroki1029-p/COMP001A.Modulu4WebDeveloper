<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ichiraku - Application Form</title>
    <link rel="stylesheet" href="main.css">
    <link rel="shortcut icon" href="images/icon.jpg">
</head>
<body>
    <header>
        <h1>Welcome to Ichiraku</h1>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="ramen.html">Menu</a></li>
                <li><a href="media.html">Media</a></li>
                <li><a href="contact.html">Contact</a></li>
                <li><a href="form.html">Application Form</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <!-- Beginning of the application form -->
        <form action="form.html" method="post" class="">
            <label for="name">Name:</label>
            <input type="text" id="name" name="name" required><br><br>

            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required><br><br>

            <label for="phone">Phone:</label>
            <input type="tel" id="phone" name="phone"><br><br>

            <label for="position">Position of Interest:</label>
            <select id="position" name="position">
                <option value="">Select a position</option>
                <option value "rider">Rider</option>
                <option value "chef">Chef</option>
                <option value "manager">Manager</option>
            </select><br><br>

            <label for="experience">Experience:</label><br>
            <textarea id="experience" name="experience" rows="4" cols="50"></textarea><br><br>

            <input type "submit" value "Submit Application">
        </form>
    </main>
